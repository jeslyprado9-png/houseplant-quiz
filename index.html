<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244b37">
  <title>Which Houseplant Fits Your Lifestyle?</title>
  <style>
:root{color-scheme:light;--ink:#244b37;--muted:#657466;--paper:#f5f4eb;--line:#dce2d4;--green:#315e42}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}main{max-width:1040px;margin:auto;padding:45px 24px 24px}header{position:relative;text-align:center;max-width:760px;margin:auto}.brand{font-size:.72rem;letter-spacing:.19em;font-weight:750}.eyebrow{margin:42px 0 12px;color:var(--muted);font-size:.86rem}h1{font-family:Georgia,serif;font-size:clamp(2.5rem,6vw,4rem);font-weight:400;line-height:1.1;letter-spacing:-.04em;margin:0 auto;max-width:650px}.intro{max-width:500px;margin:22px auto 0;color:var(--muted);font-size:.95rem}.botanical{font-size:2.8rem;margin:15px 0 5px}.quiz-card{max-width:650px;margin:0 auto;background:#fffef8;border:1px solid var(--line);border-radius:20px;padding:32px 36px;box-shadow:0 15px 45px #244b3708}.progress-label{display:flex;justify-content:space-between;gap:10px;font-size:.72rem;color:var(--muted)}#step-label{font-weight:700;color:var(--green)}progress{display:block;appearance:none;border:0;width:100%;height:4px;margin:12px 0 28px;background:var(--line);border-radius:10px}progress::-webkit-progress-bar{background:var(--line);border-radius:10px}progress::-webkit-progress-value{background:#6f9464;border-radius:10px}progress::-moz-progress-bar{background:#6f9464}fieldset{padding:0;border:0;margin:0}legend,h2{font-family:Georgia,serif;font-size:1.8rem;line-height:1.25;margin:0 0 10px;letter-spacing:-.02em}.hint{color:var(--muted);font-size:.86rem;margin:0 0 20px}.options{display:grid;gap:10px}.option{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:background .15s,border-color .15s}.option:hover{background:#f3f6ed}.option:has(input:checked){background:#eaf1e3;border-color:#6f9464}.option:has(input:focus-visible){outline:3px solid #739a66;outline-offset:3px}input{accent-color:var(--green);width:17px;height:17px;flex-shrink:0}.option span{font-size:.9rem}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}button{background:var(--green);color:white;border:1px solid var(--green);border-radius:8px;font:inherit;font-size:.86rem;font-weight:650;padding:12px 23px;cursor:pointer}button:hover{background:#244b37}button:focus-visible{outline:3px solid #89a67c;outline-offset:4px}.secondary{background:transparent;color:var(--green);margin-right:auto}.secondary:hover{background:#eaf1e3}footer{text-align:center;font-size:.72rem;color:var(--muted);margin-top:30px}footer span{display:block;font-size:1.3rem;margin-top:8px}.result-icon{font-size:3.4rem;margin:0}.result-kicker{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}#result h2{font-size:2.7rem}#result h3{font-size:.9rem;margin:26px 0 10px}#result ul{padding-left:22px;color:var(--muted);font-size:.9rem}#result li{margin:8px 0}.pet-note{font-size:.8rem;background:#f1f3e8;border-radius:8px;padding:12px;color:var(--muted)}#result button{margin-top:15px}[hidden]{display:none!important}@media(max-width:540px){main{padding:25px 16px}.eyebrow{margin-top:30px}.quiz-card{padding:25px 20px;border-radius:15px}legend{font-size:1.6rem}.progress-label{font-size:.68rem}.intro{font-size:.9rem}.botanical{margin:12px 0}button{min-height:46px}.option{min-height:55px}}
  </style>
</head>
<body>
  <main>
    <header>
      <span class="brand">✳ THE LITTLE GREEN QUIZ</span>
      <p class="eyebrow">A little nature. A happier home.</p>
      <h1>Which houseplant fits your lifestyle?</h1>
      <p class="intro">Your perfect plant is out there. Answer five quick questions to find a green companion that feels right at home.</p>
      <div class="botanical" aria-hidden="true">🌿</div>
    </header>
    <section class="quiz-card" aria-label="Houseplant quiz">
      <form id="quiz">
        <div class="progress-label"><span id="step-label">Question 1 of 5</span><span>Find your roots</span></div>
        <progress id="progress" max="5" value="1" aria-label="Quiz progress"></progress>
        <div id="question"></div>
        <div class="actions"><button id="back" type="button" class="secondary" hidden>Back</button><button id="next" type="submit">Continue <span aria-hidden="true">→</span></button></div>
      </form>
      <article id="result" hidden aria-labelledby="result-title" tabindex="-1"></article>
    </section>
    <footer>Made for real life, and a little room to grow. <span aria-hidden="true">✳</span></footer>
  </main>
  <script>
'use strict';
const questions = [
  { title: 'How much sunlight does your space get?', hint: 'Think about the spot where your new plant will live.', options: ['Low light — away from windows', 'Medium light — bright, indirect light', 'Lots of light — a sunny windowsill'], scores: [[2, 4, 1, 0], [4, 2, 4, 1], [1, 2, 2, 5]] },
  { title: 'What’s your watering style?', hint: 'Be honest. Your plant will thank you.', options: ['I tend to forget for a while', 'I like a regular weekly check-in', 'I enjoy checking the soil often'], scores: [[1, 5, 0, 4], [4, 2, 4, 1], [3, 1, 4, 2]] },
  { title: 'How green is your thumb?', hint: 'There’s a good match for every experience level.', options: ['Brand new to plant parenthood', 'I’ve kept a few plants happy', 'I’m an experienced plant parent'], scores: [[4, 4, 3, 1], [3, 3, 4, 3], [2, 2, 3, 4]] },
  { title: 'How much room can you share?', hint: 'A tiny corner counts, too.', options: ['A small shelf or windowsill', 'Room for a hanging or trailing plant', 'A roomy floor or tabletop spot'], scores: [[2, 2, 2, 4], [5, 0, 5, 0], [2, 5, 3, 3]] },
  { title: 'What kind of greenery do you love?', hint: 'Go with the look that makes you smile.', options: ['Lush, leafy growth', 'Sculptural, succulent-style plants', 'I love them both'], scores: [[5, 0, 5, 0], [0, 4, 0, 5], [2, 2, 2, 2]] }
];
const plants = [
  { name: 'Pothos', icon: '🌿', description: 'A lush, easygoing companion with heart-shaped leaves and beautiful trailing vines. A lovely match for shelves and hanging pots.', tips: ['Light: bright, indirect light is ideal; tolerates lower light, with slower growth.', 'Water: let the top 1–2 inches of soil dry before watering. Never leave the pot sitting in water.', 'Space: let vines trail from a shelf or trim them to keep growth compact.'], pets: 'Keep away from pets and children who might chew the leaves; pothos is toxic if ingested.' },
  { name: 'Snake plant', icon: '🪴', description: 'Upright, architectural leaves and a forgiving nature make this a great companion for busy days and occasional forgotten waterings.', tips: ['Light: medium to bright, indirect light is best; tolerates low light with slower growth.', 'Water: allow the soil to dry completely between waterings. Water less in winter.', 'Space: choose a pot with drainage; its upright leaves suit narrow corners.'], pets: 'Keep away from pets and children who might chew the leaves; snake plant is toxic if ingested.' },
  { name: 'Spider plant', icon: '🌱', description: 'An upbeat, leafy plant with arching ribbons of green and charming baby plantlets. Perfect for someone who enjoys regular plant check-ins.', tips: ['Light: give it bright, indirect light; avoid harsh afternoon sun.', 'Water: water when the top inch of soil feels dry, then let excess water drain away.', 'Space: use a shelf or hanging pot with room for arching leaves and plantlets.'], pets: 'Generally considered non-toxic to cats and dogs, though chewing any plant can upset their stomach.' },
  { name: 'Jade plant', icon: '🌵', description: 'A compact succulent with plump, glossy leaves and a miniature tree shape. A sunny spot and a light hand with watering help it thrive.', tips: ['Light: needs a very bright window with several hours of sun. Introduce direct sun gradually.', 'Water: let the soil dry completely before watering; use a draining pot and succulent mix.', 'Space: a sunny windowsill is ideal. Rotate the pot occasionally for balanced growth.'], pets: 'Keep away from pets and children who might chew the leaves; jade plant is toxic to cats and dogs.' }
];
const form = document.querySelector('#quiz');
const result = document.querySelector('#result');
const answers = Array(questions.length).fill(null);
let step = 0;
function recommend(values) {
  const totals = plants.map(() => 0);
  values.forEach((answer, index) => questions[index].scores[answer].forEach((score, plant) => { totals[plant] += score; }));
  // Jade requires strong light; a style preference must never override that need.
  if (values[0] !== 2) totals[3] = -1;
  if (values[0] === 0) totals[2] = -1;
  return totals.indexOf(Math.max(...totals));
}
function renderQuestion(focus = false) {
  const q = questions[step];
  document.querySelector('#step-label').textContent = `Question ${step + 1} of ${questions.length}`;
  document.querySelector('#progress').value = step + 1;
  document.querySelector('#question').innerHTML = `<fieldset><legend id="question-title" tabindex="-1">${q.title}</legend><p class="hint">${q.hint}</p><div class="options">${q.options.map((label, i) => `<label class="option"><input type="radio" name="answer" value="${i}" required ${answers[step] === i ? 'checked' : ''}><span>${label}</span></label>`).join('')}</div></fieldset>`;
  document.querySelector('#back').hidden = step === 0;
  document.querySelector('#next').textContent = step === questions.length - 1 ? 'Find my plant →' : 'Continue →';
  if (focus) document.querySelector('#question-title').focus();
}
document.querySelector('#back').addEventListener('click', () => {
  if (step > 0) { step--; renderQuestion(true); }
});
form.addEventListener('change', () => { answers[step] = Number(new FormData(form).get('answer')); });
form.addEventListener('submit', event => {
  event.preventDefault();
  if (!form.reportValidity()) return;
  answers[step] = Number(new FormData(form).get('answer'));
  if (step < questions.length - 1) { step++; renderQuestion(true); return; }
  const plant = plants[recommend(answers)];
  form.hidden = true;
  result.innerHTML = `<p class="result-kicker">Meet your green companion</p><p class="result-icon" aria-hidden="true">${plant.icon}</p><h2 id="result-title">${plant.name}</h2><p>${plant.description}</p><h3>A little care goes a long way</h3><ul>${plant.tips.map(tip => `<li>${tip}</li>`).join('')}</ul><p class="pet-note">${plant.pets}</p><p class="hint">Your closest match, based on your answers. Always check your plant’s light and soil before watering.</p><button type="button" id="restart">Take the quiz again ↻</button>`;
  result.hidden = false;
  result.focus();
  document.querySelector('#restart').addEventListener('click', () => {
    answers.fill(null); step = 0; result.hidden = true; form.hidden = false; renderQuestion(true);
  });
});
renderQuestion();
  </script>
</body>
</html>
